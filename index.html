<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#f26b1d">
<title>Deeksha Vedantu | Status Picture</title>
<style>
  :root {
    color-scheme: light;
    --accent: #f26b1d;
    --accent-dark: #d94f00;
    --accent-grad: linear-gradient(135deg, #f58220, #d94f00);
    --bg: #fff1e3;
    --card: #fffaf5;
    --text: #2b1a10;
    --muted: #7a5a45;
    --border: #f1d3b8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: linear-gradient(180deg, #ffdcbc 0%, #fff3e6 60%, #fff3e6 100%) fixed;
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 24px 16px;
  }
  .wrap { width: 100%; max-width: 520px; }
  h1 {
    font-size: 30px; font-weight: 800; letter-spacing: .4px;
    margin: 4px 0 4px; text-align: center;
    background: linear-gradient(90deg, #f58220, #d94f00);
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
  }
  .sub { text-align: center; color: var(--muted); margin: 0 0 20px; font-size: 14px; }
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-top: 3px solid var(--accent);
    border-radius: 16px;
    padding: 20px;
    box-shadow: 0 8px 28px rgba(217, 79, 0, .15);
  }
  [hidden] { display: none !important; }
  label { display: block; font-weight: 600; font-size: 14px; margin: 14px 0 6px; }
  input[type=text] {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--border); border-radius: 10px;
    background: #ffffff; color: var(--text);
  }
  input[type=text]:focus { outline: 2px solid var(--accent); border-color: var(--accent); }
  input[type=file] { width: 100%; font-size: 14px; }
  .photo-preview {
    width: 96px; height: 96px; border-radius: 50%; object-fit: cover;
    border: 3px solid var(--border); display: block; margin: 12px auto 0;
  }
  button {
    font-size: 16px; font-weight: 600; padding: 13px 18px;
    border: 0; border-radius: 10px; cursor: pointer; width: 100%;
    background: var(--accent-grad); color: #ffffff; margin-top: 16px;
  }
  button:hover { filter: brightness(1.07); }
  button.secondary { background: #ffe8d4; color: var(--text); border: 1px solid var(--border); }
  button.secondary:hover { background: #ffdcc0; filter: none; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  canvas {
    width: 100%; height: auto; display: block;
    border-radius: 12px; border: 1px solid var(--border);
  }
  .center { text-align: center; }
  .msg { color: var(--muted); padding: 24px 8px; text-align: center; }
  .error { color: #9a1b0f; background: #fde8e4; border: 1px solid #f5b5ab; border-radius: 10px; padding: 14px; font-size: 14px; }
  .spinner {
    width: 36px; height: 36px; margin: 0 auto 12px;
    border: 4px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hint { font-size: 12px; color: var(--muted); margin-top: 6px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Deeksha Vedantu</h1>
  <p class="sub">Your personalised status picture, ready to download</p>

  <div class="card">

    <!-- Loading -->
    <div id="view-loading" class="msg">
      <div class="spinner"></div>
      Fetching the latest design…
    </div>

    <!-- Error -->
    <div id="view-error" hidden>
      <div class="error" id="error-text"></div>
      <button id="btn-retry">Try again</button>
    </div>

    <!-- Setup: ask for name + photo -->
    <div id="view-setup" hidden>
      <div class="center"><strong id="setup-title">Let's set you up (one time only)</strong></div>

      <label for="name-input">Your name</label>
      <input type="text" id="name-input" placeholder="e.g. Kalash Sharma" maxlength="40" autocomplete="name">

      <label for="photo-input">Your photo</label>
      <input type="file" id="photo-input" accept="image/*">
      <img id="photo-preview" class="photo-preview" alt="" hidden>
      <div class="hint">A clear, front-facing photo works best. It stays on your device.</div>

      <button id="btn-save" disabled>Save and create my picture</button>
      <button id="btn-cancel" class="secondary" hidden>Cancel</button>
    </div>

    <!-- Result -->
    <div id="view-result" hidden>
      <canvas id="canvas"></canvas>
      <button id="btn-download">⬇ Download picture</button>
      <button id="btn-share" class="secondary" hidden>Share…</button>
      <button id="btn-edit" class="secondary">Change my name / photo</button>
    </div>

  </div>
  <p id="debug" class="hint center" hidden></p>
</div>

<script>
/* ============================================================
   SETTINGS: the only thing you need to edit in this file
   ------------------------------------------------------------
   Paste the "published to web" CSV link of your Google Sheet
   between the quotes below. (See the setup steps I gave you.)
   ============================================================ */
const CONFIG = {
  SHEET_CSV_URL: "https://docs.google.com/spreadsheets/d/e/2PACX-1vRpiPfu6RDnLOXe7METJiv5JGuDej6dOMCJ56-HTCsTg24oJh3agKhGjqjqSbc5StaDrGRKHObB6pL8/pub?gid=0&single=true&output=csv",
  // OPTIONAL but recommended: live data straight from the sheet (no waiting for Google's "publish" delay).
  // Paste the sheet's own ID here: it's the long text between /d/ and /edit in the sheet's normal address.
  // The sheet must be shared as "Anyone with the link can view". Leave "" to use only the published CSV above.
  SHEET_ID: "",
  SHEET_GID: "0",          // the number after gid= in the sheet's address (0 is the first tab)
  NEWEST_ROW: "bottom",    // "bottom" = newest link is the lowest row; use "top" if you add new rows above old ones
  MAX_WIDTH: 2000          // large designs are scaled down to this width
};

/* ---------- small helpers ---------- */
const $ = id => document.getElementById(id);
const VIEWS = ['loading', 'error', 'setup', 'result'];
function show(name) { VIEWS.forEach(v => $('view-' + v).hidden = (v !== name)); }
function showError(msg) { $('error-text').textContent = msg; show('error'); }

/* ---------- saved user details (kept in this browser) ---------- */
const STORAGE_KEY = 'statusPicProfile';
function loadProfile() {
  try { return JSON.parse(localStorage.getItem(STORAGE_KEY)); } catch (e) { return null; }
}
function saveProfile(p) {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); return true; } catch (e) { return false; }
}

/* ---------- read the Google Sheet ---------- */
function parseCSV(text) {
  const rows = []; let row = [], cell = '', inQuotes = false;
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (inQuotes) {
      if (ch === '"' && text[i + 1] === '"') { cell += '"'; i++; }
      else if (ch === '"') inQuotes = false;
      else cell += ch;
    } else if (ch === '"') inQuotes = true;
    else if (ch === ',') { row.push(cell); cell = ''; }
    else if (ch === '\n' || ch === '\r') {
      if (ch === '\r' && text[i + 1] === '\n') i++;
      row.push(cell); rows.push(row); row = []; cell = '';
    } else cell += ch;
  }
  row.push(cell); rows.push(row);
  return rows;
}

function extractDriveId(text) {
  if (!text) return null;
  const m = text.match(/\/d\/([a-zA-Z0-9_-]{15,})/) || text.match(/[?&]id=([a-zA-Z0-9_-]{15,})/);
  return m ? m[1] : null;
}

async function getDesignFromSheet() {
  // Sources are tried in order: the live sheet first (if SHEET_ID is set), then the published CSV
  const sources = [];
  if (CONFIG.SHEET_ID) {
    sources.push({
      name: 'live sheet',
      url: 'https://docs.google.com/spreadsheets/d/' + CONFIG.SHEET_ID + '/gviz/tq?tqx=out:csv&gid=' + encodeURIComponent(CONFIG.SHEET_GID)
    });
  }
  if (CONFIG.SHEET_CSV_URL && !CONFIG.SHEET_CSV_URL.includes('PASTE_YOUR')) {
    sources.push({ name: 'published CSV', url: CONFIG.SHEET_CSV_URL });
  }
  if (!sources.length) {
    throw new Error('The sheet link has not been set up yet. Please ask the admin to add it in index.html (CONFIG → SHEET_CSV_URL).');
  }

  let lastProblem = 'Could not read the design sheet.';
  for (const src of sources) {
    // a fresh random value on every load so nothing old is reused
    const url = src.url + (src.url.includes('?') ? '&' : '?') + 'nocache=' + Date.now() + Math.random().toString(36).slice(2, 8);
    try {
      const res = await fetch(url, { cache: 'no-store' });
      if (!res.ok) { lastProblem = 'Could not read the design sheet (error ' + res.status + ').'; continue; }
      const rows = parseCSV(await res.text());
      const order = rows.map((_, i) => i);
      if (CONFIG.NEWEST_ROW !== 'top') order.reverse();      // default: look from the bottom up
      for (const i of order) {
        for (const cell of rows[i]) {
          const id = extractDriveId(cell);
          if (id) return { id: id, row: i + 1, source: src.name };
        }
      }
      lastProblem = 'No Google Drive image link was found in the sheet.';
    } catch (e) {
      lastProblem = 'Could not reach the design sheet. Check your internet connection.';
    }
  }
  throw new Error(lastProblem);
}

// Add ?debug to the page address to see which sheet row was used
function showDebug(found) {
  if (!/[?&]debug\b/.test(location.search)) return;
  const el = $('debug');
  el.textContent = 'Debug: used ' + found.source + ', row ' + found.row + ', file id ' + found.id.slice(0, 8) + '…';
  el.hidden = false;
}

/* ---------- load the design image from Google Drive ---------- */
function loadImage(src) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.crossOrigin = 'anonymous';          // needed so the final picture can be downloaded
    img.onload = () => resolve(img);
    img.onerror = () => reject(new Error('load failed'));
    img.src = src;
  });
}

async function loadDesign(id) {
  // We try a few Google addresses in turn until one works
  const candidates = [
    'https://lh3.googleusercontent.com/d/' + id + '=w' + CONFIG.MAX_WIDTH,
    'https://drive.google.com/thumbnail?id=' + id + '&sz=w' + CONFIG.MAX_WIDTH,
    'https://images.weserv.nl/?url=' + encodeURIComponent('https://drive.google.com/uc?export=view&id=' + id)
  ];
  for (const src of candidates) {
    try { return await loadImage(src); } catch (e) { /* try the next one */ }
  }
  throw new Error('Could not load the design image. Make sure it is shared on Google Drive as "Anyone with the link can view".');
}

/* ---------- resize the uploaded photo to a small square ---------- */
function fileToSquareDataUrl(file, size) {
  size = size || 400;
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const c = document.createElement('canvas');
      c.width = c.height = size;
      const s = Math.min(img.naturalWidth, img.naturalHeight);
      const sx = (img.naturalWidth - s) / 2, sy = (img.naturalHeight - s) / 2;
      c.getContext('2d').drawImage(img, sx, sy, s, s, 0, 0, size, size);
      URL.revokeObjectURL(url);
      resolve(c.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Could not read that image.')); };
    img.src = url;
  });
}

/* ---------- footer (name + photo) ---------- */
const BAR_FONT = '"Segoe UI", Roboto, Helvetica, Arial, sans-serif';
function accentH(W) { return Math.max(4, Math.round(W * 0.007)); }

function paintBarBase(c, y, W, h) {
  const bg = c.createLinearGradient(0, y, W, y + h);
  bg.addColorStop(0, '#fff3e6');
  bg.addColorStop(1, '#ffd3a8');
  c.fillStyle = bg;
  c.fillRect(0, y, W, h);
}
function paintAccent(c, y, W) {
  const bar = c.createLinearGradient(0, 0, W, 0);
  bar.addColorStop(0, '#f58220');
  bar.addColorStop(1, '#d94f00');
  c.fillStyle = bar;
  c.fillRect(0, y, W, accentH(W));
}
// Footer: orange line on top, then photo + name centred in the space below it
function paintFooter(c, y, W, h, profile, photo) {
  paintBarBase(c, y, W, h);
  paintAccent(c, y, W);
  const line = accentH(W);
  const avail = h - line;                 // space left under the orange line
  const pad = avail * 0.16;               // same padding above and below
  const d = avail - pad * 2;              // photo diameter
  const gap = avail * 0.22;

  let fontSize = avail * 0.32;
  const maxTextW = W * 0.8 - d - gap;
  c.font = '700 ' + fontSize + 'px ' + BAR_FONT;
  while (c.measureText(profile.name).width > maxTextW && fontSize > 10) {
    fontSize -= 2;
    c.font = '700 ' + fontSize + 'px ' + BAR_FONT;
  }
  const textW = c.measureText(profile.name).width;
  const startX = (W - (d + gap + textW)) / 2;
  const cy = y + line + avail / 2;

  c.save();
  c.beginPath();
  c.arc(startX + d / 2, cy, d / 2, 0, Math.PI * 2);
  c.closePath();
  c.clip();
  c.drawImage(photo, startX, cy - d / 2, d, d);
  c.restore();

  c.beginPath();
  c.arc(startX + d / 2, cy, d / 2, 0, Math.PI * 2);
  c.lineWidth = Math.max(2, d * 0.04);
  c.strokeStyle = '#f26b1d';
  c.stroke();

  c.fillStyle = '#3b1a08';
  c.textBaseline = 'middle';
  c.textAlign = 'left';
  c.fillText(profile.name, startX + d + gap, cy);
}

/* ---------- draw the final picture ---------- */
let photoCache = { src: null, img: null };
function getPhoto(src) {
  if (photoCache.src === src && photoCache.img) return Promise.resolve(photoCache.img);
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => { photoCache = { src: src, img: img }; resolve(img); };
    img.onerror = () => reject(new Error('Could not load your photo.'));
    img.src = src;
  });
}

let renderToken = 0;
async function renderPicture(designImg, profile) {
  const token = ++renderToken;
  const photo = await getPhoto(profile.photo);
  if (token !== renderToken) return;       // a newer drawing request replaced this one

  const scale = Math.min(1, CONFIG.MAX_WIDTH / designImg.naturalWidth);
  const W = Math.round(designImg.naturalWidth * scale);
  const H = Math.round(designImg.naturalHeight * scale);
  const footerH = Math.round(W * 0.13);

  const canvas = $('canvas');
  canvas.width = W;
  canvas.height = H + footerH;
  const ctx = canvas.getContext('2d');

  ctx.drawImage(designImg, 0, 0, W, H);
  paintFooter(ctx, H, W, footerH, profile, photo);
}

/* ---------- screens ---------- */
let designImg = null;
let pendingPhoto = null;

function validateSetup() {
  $('btn-save').disabled = !($('name-input').value.trim() && pendingPhoto);
}

function showSetup(existing) {
  pendingPhoto = existing ? existing.photo : null;
  $('name-input').value = existing ? existing.name : '';
  $('photo-input').value = '';
  const prev = $('photo-preview');
  if (pendingPhoto) { prev.src = pendingPhoto; prev.hidden = false; } else { prev.hidden = true; }
  $('setup-title').textContent = existing ? 'Update your details' : "Let's set you up (one time only)";
  $('btn-cancel').hidden = !existing;
  validateSetup();
  show('setup');
}

let currentProfile = null;   // kept in memory too, in case the browser blocks saving

async function showResult() {
  const profile = currentProfile || loadProfile();
  show('result');
  try { await renderPicture(designImg, profile); }
  catch (e) { showError(e.message); return; }
  $('btn-share').hidden = !(navigator.canShare && navigator.share);
}

function fileName() {
  const p = currentProfile || loadProfile();
  const safe = (p && p.name ? p.name : 'me').replace(/[^a-z0-9]+/gi, '-').replace(/^-|-$/g, '').toLowerCase();
  return 'status-' + (safe || 'me') + '.png';
}

/* ---------- start-up ---------- */
async function init() {
  show('loading');
  try {
    const found = await getDesignFromSheet();
    showDebug(found);
    designImg = await loadDesign(found.id);
  } catch (e) {
    showError(e.message);
    return;
  }
  if (loadProfile()) showResult(); else showSetup(null);
}

/* ---------- button wiring ---------- */
$('name-input').addEventListener('input', validateSetup);

$('photo-input').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  try {
    pendingPhoto = await fileToSquareDataUrl(file, 400);
    $('photo-preview').src = pendingPhoto;
    $('photo-preview').hidden = false;
  } catch (err) {
    pendingPhoto = null;
    alert(err.message);
  }
  validateSetup();
});

$('btn-save').addEventListener('click', () => {
  const profile = { name: $('name-input').value.trim(), photo: pendingPhoto };
  if (!saveProfile(profile)) {
    alert('Could not save your details on this device (storage may be blocked). You can still create the picture now.');
  }
  currentProfile = profile;   // use it right away even if saving failed
  showResult();
});

$('btn-cancel').addEventListener('click', showResult);
$('btn-edit').addEventListener('click', () => showSetup(currentProfile || loadProfile()));
$('btn-retry').addEventListener('click', init);


$('btn-download').addEventListener('click', () => {
  $('canvas').toBlob(blob => {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileName();
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
});

$('btn-share').addEventListener('click', () => {
  $('canvas').toBlob(blob => {
    const file = new File([blob], fileName(), { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      navigator.share({ files: [file] }).catch(() => {});
    }
  }, 'image/png');
});

init();
</script>
</body>
</html>
